name: Project CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Isolated unit tests (no live models or HTTP)
        run: python scripts/run_tests.py unit
      - name: Compile Python sources
        run: python -m compileall -q backend/app scripts integration_tests tests

  integration:
    runs-on: ubuntu-latest
    env:
      AGENTFLOW_INTEGRATION_TESTS: "1"
      TESTING: "false"
      POSTGRES_URL: postgresql+asyncpg://agentflow_test:test_only_password@127.0.0.1:55432/agentflow_test
      REDIS_URL: redis://127.0.0.1:56379/15
      ENABLE_MONGODB: "false"
      AUTH_SIGNING_SECRET: ci-only-not-a-deployment-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentflow_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: agentflow_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow_test -d agentflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations and real-adapter integration (no test fallback)
        run: python scripts/run_tests.py integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
