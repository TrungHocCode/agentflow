services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://agentflow:agentflow_password@postgres:5432/agentflow_db
      - MONGO_URL=mongodb://agentflow:agentflow_password@mongodb:27017/agentflow_runs?authSource=admin
      - ENABLE_MONGODB=false
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173
      - ARTIFACT_ROOT=/app/workspace_data
      - AUTH_SIGNING_SECRET=change-this-in-local-env
    volumes:
      - artifacts_data:/app/workspace_data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow_worker
    restart: always
    command: ["python", "-m", "app.workers.run_worker"]
    environment:
      - POSTGRES_URL=postgresql+asyncpg://agentflow:agentflow_password@postgres:5432/agentflow_db
      - MONGO_URL=mongodb://agentflow:agentflow_password@mongodb:27017/agentflow_runs?authSource=admin
      - ENABLE_MONGODB=false
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACT_ROOT=/app/workspace_data
    volumes:
      - artifacts_data:/app/workspace_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentflow_db_init
    command: ["python", "-m", "app.db.init_db"]
    environment:
      - POSTGRES_URL=postgresql+asyncpg://agentflow:agentflow_password@postgres:5432/agentflow_db
      - MONGO_URL=mongodb://agentflow:agentflow_password@mongodb:27017/agentflow_runs?authSource=admin
      - ENABLE_MONGODB=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agentflow_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: agentflow_postgres
    restart: always
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow_password
      POSTGRES_DB: agentflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: agentflow_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: agentflow
      MONGO_INITDB_ROOT_PASSWORD: agentflow_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:latest
    container_name: agentflow_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: agentflow
      ME_CONFIG_MONGODB_ADMINPASSWORD: agentflow_password
      ME_CONFIG_MONGODB_URL: mongodb://agentflow:agentflow_password@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

  redis:
    image: redis:7-alpine
    container_name: agentflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  artifacts_data:
