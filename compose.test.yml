# Disposable services only; no connection to development volumes or ports.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentflow_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: agentflow_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow_test -d agentflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
